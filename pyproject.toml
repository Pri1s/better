[project]
name = "better"
version = "0.1.0"
description = "Personal research tool for NBA player props"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "requests>=2.34.2",
]

[project.scripts]
better = "better.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
